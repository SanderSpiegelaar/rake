version: 2.1

executors:
  linux:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    environment:
      CARGO_TERM_COLOR: always
  macos:
    macos:
      xcode: 27.2.0
    resource_class: m4pro.medium
    environment:
      CARGO_TERM_COLOR: always

commands:
  linux_dependencies:
    steps:
      - run:
          name: Install WebKitGTK and smoke test tools
          command: |
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libgdk-pixbuf2.0-bin pkg-config xvfb x11-apps imagemagick weston dbus-x11 fonts-dejavu xdg-utils
  setup:
    steps:
      - checkout
      - restore_cache:
          keys:
            - cargo-{{ arch }}-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
            - cargo-{{ arch }}-{{ checksum "rust-toolchain.toml" }}-
      # The Xcode image ships without Rust; rustup reads the pinned toolchain from rust-toolchain.toml.
      - run:
          name: Install Rust
          command: |
            if ! command -v rustup >/dev/null && [ ! -x "$HOME/.cargo/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
            fi
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            rustup show
  save_cargo_cache:
    steps:
      - save_cache:
          key: cargo-{{ arch }}-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.rustup
            - ~/.cargo/bin
            - ~/.cargo/registry
            - ~/.cargo/git
            - target

jobs:
  check-linux:
    executor: linux
    steps:
      - setup
      - linux_dependencies
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run:
          command: python3 tests/linux_smoke.py
          no_output_timeout: 15m
      - store_artifacts:
          path: target/linux-smoke
      - save_cargo_cache

  check:
    executor: macos
    steps:
      - setup
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - save_cargo_cache

  smoke:
    executor: macos
    steps:
      - setup
      - run:
          command: python3 tests/smoke.py
          no_output_timeout: 15m

  release-macos:
    executor: macos
    steps:
      - setup
      - run:
          name: Check release version
          command: |
            python3 - \<<'PY'
            import json
            import os
            import subprocess

            metadata = json.loads(subprocess.check_output([
                "cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"
            ]))
            tag = os.environ["CIRCLE_TAG"]
            for package in metadata["packages"]:
                if tag != f'v{package["version"]}':
                    raise SystemExit(f'{tag} does not match {package["name"]} {package["version"]}')
            PY
      - run: cargo xtask template arm64
      - run: cargo xtask template x86_64
      - run: cargo xtask template universal
      - run: cargo build --release --locked --package rake-cli --target aarch64-apple-darwin --target-dir target
      - run: cargo build --release --locked --package rake-cli --target x86_64-apple-darwin --target-dir target
      - run:
          name: Prepare CLI and checksums
          working_directory: target/template
          command: |
            lipo -create ../aarch64-apple-darwin/release/rake ../x86_64-apple-darwin/release/rake -output rake
            codesign --force --sign - rake
            lipo rake -verify_arch arm64
            lipo rake -verify_arch x86_64
            shasum -a 256 rake >> SHA256SUMS
            shasum -a 256 --check SHA256SUMS
      - run:
          name: Stage macOS assets
          command: |
            mkdir -p release-assets
            cp target/template/rake "target/template/rake-template-${CIRCLE_TAG#v}-macos-"*.tar.gz release-assets/
      - persist_to_workspace:
          root: release-assets
          paths:
            - rake
            - rake-template-*.tar.gz

  release-linux:
    parameters:
      arch:
        type: string
      resource:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource >>
    steps:
      - setup
      - linux_dependencies
      - run: cargo xtask template << parameters.arch >>
      - run: cargo build --release --locked --package rake-cli
      - run:
          name: Stage Linux assets
          command: |
            mkdir -p release-assets
            cp target/release/rake release-assets/rake-linux-<< parameters.arch >>
            cp "target/template/rake-template-${CIRCLE_TAG#v}-linux-<< parameters.arch >>.tar.gz" release-assets/
      - persist_to_workspace:
          root: release-assets
          paths:
            - rake-linux-<< parameters.arch >>
            - rake-template-*-linux-<< parameters.arch >>.tar.gz

  publish:
    executor: macos
    steps:
      - attach_workspace:
          at: release-assets
      - run:
          name: Combine release checksums
          working_directory: release-assets
          command: |
            shasum -a 256 rake rake-linux-* rake-template-*.tar.gz > SHA256SUMS
            shasum -a 256 --check SHA256SUMS
      # GH_TOKEN comes from the github-release context and needs contents: write on the repo.
      - run:
          name: Publish release
          command: |
            command -v gh >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install gh
            export GH_REPO="$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME"
            gh release create "$CIRCLE_TAG" --verify-tag --title "$CIRCLE_TAG" --generate-notes \
              release-assets/*

workflows:
  ci:
    jobs:
      - check
      - check-linux
      - smoke

  release:
    jobs:
      - release-macos:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - release-linux:
          name: release-linux-x86_64
          arch: x86_64
          resource: medium
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - release-linux:
          name: release-linux-arm64
          arch: arm64
          resource: arm.medium
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - publish:
          context: github-release
          requires:
            - release-macos
            - release-linux-x86_64
            - release-linux-arm64
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
