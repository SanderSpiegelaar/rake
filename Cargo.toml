[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAlert", "NSApplication"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString"] }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tao = { version = "=0.37.2", default-features = false, features = ["rwh_06"] }
thiserror = "=2.0.21"
url = "=2.5.8"
wry = { version = "=0.57.1", default-features = false, features = ["os-webview", "devtools"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"
