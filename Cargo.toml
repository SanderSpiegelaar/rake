[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tao = { version = "=0.37.2", default-features = false, features = ["rwh_06"] }
thiserror = "=2.0.21"
url = "=2.5.8"
wry = { version = "=0.57.1", default-features = false, features = ["os-webview"] }
