name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"
          ]))
          tag = os.environ["RELEASE_TAG"]
          for package in metadata["packages"]:
              if tag != f'v{package["version"]}':
                  raise SystemExit(f'{tag} does not match {package["name"]} {package["version"]}')
          PY
      - run: cargo xtask template
      - run: cargo build --release --locked --package rake-cli --target aarch64-apple-darwin --target-dir target
      - name: Prepare CLI and checksums
        working-directory: target/template
        run: |
          cp ../aarch64-apple-darwin/release/rake rake
          shasum -a 256 rake >> SHA256SUMS
          shasum -a 256 --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes \
            "target/template/rake-template-${RELEASE_TAG#v}-macos-arm64.tar.gz" \
            target/template/SHA256SUMS \
            target/template/rake
